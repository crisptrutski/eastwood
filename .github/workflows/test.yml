name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664
      - name: Test dependency refresh
        run: bin/ci refresh-tests
      - name: Run tests
        run: bin/ci test
      - name: Test third-party library compatibility
        run: bin/ci third-party
      - name: Test Clojure core in an isolated process
        run: bin/ci core
      - name: Test var metadata
        run: bin/ci var-info
      - name: Lint Eastwood with itself
        run: bin/ci lint
      - name: Check bundled dependency sources
        run: bin/ci drift
